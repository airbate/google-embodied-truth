<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google 具身真心话 · 3D 悬浮词云抽选</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Subtle Swiss Dot Grid & Google 4-Color Bauhaus Ambient Accents -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-ambient-glow" aria-hidden="true">
    <span class="glow-orb orb-blue"></span>
    <span class="glow-orb orb-yellow"></span>
    <span class="glow-orb orb-red"></span>
    <span class="glow-orb orb-green"></span>
  </div>

  <!-- 4-Color Google Top Ribbon -->
  <div class="top-color-bar">
    <span class="c-blue"></span>
    <span class="c-red"></span>
    <span class="c-yellow"></span>
    <span class="c-green"></span>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- 3D Floating Truth Word Cloud Space (Full Viewport Mid-Air Orbit) -->
  <div class="cloud-viewport" id="cloud-viewport" aria-label="具身真心话 3D 悬浮词云空间">
    <!-- Subtle 3D Orbital Rings in Background -->
    <div class="orbital-rings" aria-hidden="true">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
    </div>
    <!-- 3D Floating Quote Capsules Container -->
    <div class="cloud-stage-3d" id="cloud-stage-3d"></div>
  </div>

  <!-- Foreground UI Layer (Header, Spotlight Winner Card, Bottom Action Button) -->
  <main class="ui-overlay">
    <!-- Top Header -->
    <header class="hero-header">
      <div class="brand-pill">
        <span class="g-dots">
          <i class="d-blue"></i>
          <i class="d-red"></i>
          <i class="d-yellow"></i>
          <i class="d-green"></i>
        </span>
        <span class="brand-text">GOOGLE · EMBODIED AI</span>
      </div>
      <h1 class="hero-title">具身真心话</h1>
      <p class="hero-subtitle">46 条现场具身洞察悬浮于空 · 抽取嘉宾登台分享</p>
    </header>

    <!-- Center Spotlight Area (Hidden or Minimized in pure Cloud View, Pops Out from 3D Cloud on Draw) -->
    <section class="spotlight-zone" id="spotlight-zone">
      <div class="stage-card is-hidden" id="stage-card">
        <!-- Close / Back to Pure 3D Cloud Button -->
        <button class="btn-minimize-card" id="btn-minimize-card" title="收起卡片，观赏全景 3D 悬浮词云 (Esc)">
          <span>✕ 回到全景词云</span>
        </button>

        <div class="card-top-strip">
          <div class="strip-dots">
            <span class="s-dot d-blue"></span>
            <span class="s-dot d-red"></span>
            <span class="s-dot d-yellow"></span>
            <span class="s-dot d-green"></span>
          </div>
          <span class="stage-status-tag" id="stage-status-tag">ON STAGE · 登台分享</span>
        </div>

        <div class="speaker-showcase">
          <div class="avatar-frame" id="avatar-frame"></div>
          <div class="speaker-details">
            <div class="speaker-org-tag" id="speaker-org">参会嘉宾</div>
            <div class="speaker-name" id="speaker-name">虚位以待</div>
          </div>
        </div>

        <div class="truth-divider">
          <span class="div-line"></span>
          <span class="div-badge">具身真心话 · EMBODIED TRUTH</span>
          <span class="div-line"></span>
        </div>

        <div class="truth-box" id="truth-box">
          <p class="truth-content" id="truth-content"></p>
        </div>
      </div>
    </section>

    <!-- Bottom Action Control -->
    <footer class="action-area">
      <button class="draw-button" id="btn-draw">
        <span class="btn-shapes" aria-hidden="true">
          <i class="sh-circle"></i>
          <i class="sh-square"></i>
          <i class="sh-triangle"></i>
        </span>
        <span class="btn-label" id="btn-label">从词云抽取上台嘉宾</span>
      </button>
      <div class="cloud-tip">
        鼠标滑动或拖拽可自由拨动半空中的「真心话词云」 · 按 <kbd>Space</kbd> 抽取 / 锁定嘉宾
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
