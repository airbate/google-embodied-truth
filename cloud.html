<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google 具身真心话 · 3D 漫游词云</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cloud.css" />
</head>
<body data-category="positive">
  <!-- Subtle Swiss Dot Grid & Zero-Blur Radial Gradient Halos -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-ambient" aria-hidden="true">
    <span class="orb orb-blue"></span>
    <span class="orb orb-yellow"></span>
    <span class="orb orb-red"></span>
    <span class="orb orb-green"></span>
  </div>

  <!-- Bauhaus Corner Geometry -->
  <div class="bg-geometry" aria-hidden="true">
    <svg class="geo-corner geo-tl" viewBox="0 0 260 260" fill="none">
      <circle cx="85" cy="85" r="70" fill="#4285F4" />
      <rect x="100" y="48" width="102" height="102" rx="22" fill="#FBBC05" />
      <clipPath id="c-tl">
        <circle cx="85" cy="85" r="70" />
      </clipPath>
      <rect x="100" y="48" width="102" height="102" rx="22" fill="#34A853" clip-path="url(#c-tl)" />
      <circle cx="185" cy="175" r="24" fill="#EA4335" />
    </svg>

    <svg class="geo-corner geo-br" viewBox="0 0 280 240" fill="none">
      <rect x="40" y="100" width="175" height="54" rx="27" transform="rotate(-24 40 100)" fill="#EA4335" />
      <circle cx="180" cy="125" r="60" fill="#4285F4" />
      <clipPath id="c-br">
        <circle cx="180" cy="125" r="60" />
      </clipPath>
      <rect x="40" y="100" width="175" height="54" rx="27" transform="rotate(-24 40 100)" fill="#1967D2" clip-path="url(#c-br)" />
      <polygon points="70,155 125,215 30,215" fill="#34A853" />
      <circle cx="105" cy="55" r="16" fill="#FBBC05" />
    </svg>
  </div>

  <!-- 4-Color Google Top Ribbon -->
  <div class="top-color-bar">
    <span class="c-blue"></span>
    <span class="c-red"></span>
    <span class="c-yellow"></span>
    <span class="c-green"></span>
  </div>

  <!-- Top Navigation Switch back to Lottery Page -->
  <a href="index.html" class="page-switch-pill" title="前往具身真心话现场抽选舞台">
    <span class="switch-dot"></span>
    <span>前往抽选舞台 →</span>
  </a>

  <!-- Full-Screen 2.5D GPU-Accelerated Floating Quote Cloud Space -->
  <div class="cloud-viewport" id="cloud-viewport">
    <div class="orbital-rings" aria-hidden="true">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <div class="cloud-stage-3d" id="cloud-stage-3d"></div>
  </div>

  <!-- Anonymous Quote Detail Modal when Clicking a Floating Cloud Phrase -->
  <div class="quote-modal is-hidden" id="quote-modal">
    <div class="quote-card" id="quote-card">
      <button class="quote-close" id="quote-close" title="关闭 (Esc)">✕</button>
      <div class="quote-meta">
        <span class="quote-sentiment-badge" id="quote-sentiment-badge">正面好评</span>
      </div>
      <blockquote class="quote-full-text" id="quote-full-text"></blockquote>
      <div class="quote-author-row">
        <span class="quote-author-dots">
          <i class="d-blue"></i><i class="d-red"></i><i class="d-yellow"></i><i class="d-green"></i>
        </span>
      </div>
    </div>
  </div>

  <script src="cloud.js"></script>
</body>
</html>
